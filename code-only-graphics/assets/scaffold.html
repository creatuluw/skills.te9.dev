<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Code-Only 3D — OBJECT_NAME</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#15191f;font-family:system-ui,sans-serif;color:#e8edf5}
  canvas{display:block}
  #hud{position:fixed;top:14px;left:14px;background:rgba(0,0,0,.5);padding:12px 16px;border-radius:10px;max-width:380px}
  #hud h1{margin:0;font-size:15px}
  #hud p{margin:6px 0 0;font-size:12px;line-height:1.5;color:#a9b4c5}
  #hint{position:fixed;bottom:12px;width:100%;text-align:center;font-size:11px;color:#6b7588}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="hud">
  <h1>OBJECT_NAME</h1>
  <p>Built entirely from code (Three.js primitives + canvas textures + shaders). <i>OBJECT_NOTE</i></p>
</div>
<div id="hint">drag to orbit · scroll to zoom</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---- scene / renderer / orthographic iso camera ---- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15191f);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const aspect = innerWidth/innerHeight, d = 6;          // raise d for large objects
const camera = new THREE.OrthographicCamera(-d*aspect, d*aspect, d, -d, 0.1, 1000);
camera.position.set(9,9,9); camera.lookAt(0,1,0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = false; controls.minZoom = 0.6; controls.maxZoom = 2.4;
controls.target.set(0,1,0); controls.autoRotate = true; controls.autoRotateSpeed = 0.6;
// For creatures/devices swap to a PerspectiveCamera(45, aspect, 0.1, 100) at (6,4,7).

/* ---- lights ---- */
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x3a4a2a, 1.4));
const sun = new THREE.DirectionalLight(0xfff2d8, 3.0);
sun.position.set(8,16,7); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
const sc = sun.shadow.camera; sc.left=-8; sc.right=8; sc.top=8; sc.bottom=-8; sun.shadow.bias=-0.0005;
scene.add(sun);

/* ---- ground ---- */
const ground = new THREE.Mesh(
  new THREE.CylinderGeometry(7,7,0.4,48),
  new THREE.MeshStandardMaterial({ color:0x4a5a36, roughness:1 }));
ground.position.y = -0.2; ground.receiveShadow = true; scene.add(ground);

/* ════════════════════════════════════════════════════════════════
   OBJECT CONSTRUCTION
   Replace buildObject() with your hierarchy (see references/recipes.md).
   Return { object, update(t) }; drive moving parts in update.
   Techniques: references/techniques.md
   ════════════════════════════════════════════════════════════════ */
function buildObject(){
  const object = new THREE.Group();
  const m = (c,e={}) => new THREE.MeshStandardMaterial({color:c, roughness:0.8, metalness:0.1, ...e});

  // EXAMPLE placeholder — a little unit with a scanning turret. Replace entirely.
  const body = new THREE.Mesh(new THREE.BoxGeometry(2,1,1.2), m(0x4a5d2f,{flatShading:true}));
  body.position.y = 0.7; body.castShadow = body.receiveShadow = true; object.add(body);

  const turret = new THREE.Group(); turret.position.set(0,1.3,0); object.add(turret);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.8,0.4,0.8), m(0x384722,{flatShading:true}));
  head.castShadow = true; turret.add(head);
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.9,10), m(0x3a3f44,{metalness:0.4}));
  barrel.rotation.z = -Math.PI/2; barrel.position.set(0.6,0,0); turret.add(barrel);

  return {
    object,
    update(t){ turret.rotation.y = Math.sin(t*0.0005)*0.7; }   // <- drive moving parts here
  };
}

const { object, update } = buildObject();
scene.add(object);

/* ---- animate ---- */
function animate(t){
  update(t);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

addEventListener('resize', ()=>{
  const a = innerWidth/innerHeight;
  camera.left=-d*a; camera.right=d*a; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
