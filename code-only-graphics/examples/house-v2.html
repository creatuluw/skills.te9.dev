<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Code-Only 3D — Storybook Cottage v2</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#87b8d9;font-family:system-ui,sans-serif;color:#26333f}
  canvas{display:block}
  #hud{position:fixed;top:14px;left:14px;background:rgba(255,255,255,.55);backdrop-filter:blur(6px);padding:12px 16px;border-radius:12px;max-width:380px}
  #hud h1{margin:0;font-size:15px}
  #hud p{margin:6px 0 0;font-size:12px;line-height:1.5;color:#4a5a68}
  #hint{position:fixed;bottom:12px;width:100%;text-align:center;font-size:11px;color:rgba(40,55,70,.55)}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="hud">
  <h1>Storybook Cottage</h1>
  <p>Brief-first v2: clapboard / shingle / stone canvas materials, porch + dressing, sky-fog atmosphere, smoke, flickering windows, swaying tree, butterfly.</p>
</div>
<div id="hint">drag to orbit · scroll to zoom</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ══════════ renderer / camera (35mm hero shot) ══════════ */
const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 200);
camera.position.set(11, 5.5, 13); camera.lookAt(0, 2.2, 0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = false; controls.minDistance = 8; controls.maxDistance = 30;
controls.target.set(0, 2.0, 0); controls.autoRotate = true; controls.autoRotateSpeed = 0.5;
controls.maxPolarAngle = Math.PI * 0.495;   // stay above ground

/* ══════════ atmosphere pass: sky gradient + fog ══════════ */
const skyCanvas = document.createElement('canvas'); skyCanvas.width = 2; skyCanvas.height = 256;
{ const g = skyCanvas.getContext('2d');
  const grad = g.createLinearGradient(0,0,0,256);
  grad.addColorStop(0, '#6db3e8'); grad.addColorStop(0.62, '#a8d4ec'); grad.addColorStop(1, '#f2ecd8');
  g.fillStyle = grad; g.fillRect(0,0,2,256); }
const skyTex = new THREE.CanvasTexture(skyCanvas); skyTex.colorSpace = THREE.SRGBColorSpace;
scene.background = skyTex;
scene.fog = new THREE.Fog(0xd9e6e8, 22, 55);

/* ══════════ lighting pass: warm key + cool rim + sky fill ══════════ */
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x8a7a55, 0.9));
const sun = new THREE.DirectionalLight(0xffe3b8, 2.6);
sun.position.set(10, 14, 6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera; sc.left = -9; sc.right = 9; sc.top = 9; sc.bottom = -9;
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03; sun.shadow.radius = 4;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x9db8ff, 0.55); rim.position.set(-7, 6, -11); scene.add(rim);

/* ══════════ canvas material library (the "asset tier") ══════════ */
const SRGB = t => { t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; };
function canvasTex(w, h, draw, rx=1, ry=1){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); SRGB(t); t.repeat.set(rx, ry); return t;
}
// clapboard siding — 20cm exposure, cream
const sidingTex = canvasTex(256, 256, (g,w,h)=>{
  g.fillStyle = '#f4e6c4'; g.fillRect(0,0,w,h);
  for(let i=0;i<2200;i++){ g.fillStyle = Math.random()<.5 ? 'rgba(190,160,110,0.05)' : 'rgba(255,255,255,0.05)';
    g.fillRect(Math.random()*w, Math.random()*h, 2, 2); }
  for(let y=0; y<h; y+=32){                       // 32px = 20cm at this repeat
    g.fillStyle = 'rgba(160,125,80,0.35)'; g.fillRect(0, y, w, 2);
    g.fillStyle = 'rgba(255,250,235,0.5)'; g.fillRect(0, y+3, w, 1);
  }
  for(let x=64; x<w; x+=128){ g.fillStyle='rgba(160,125,80,0.18)'; g.fillRect(x,0,2,h); } // seams
}, 1, 0.75);
// scalloped shingles — terracotta, 4 courses per tile (1 world unit)
const shingleTex = canvasTex(256, 256, (g,w,h)=>{
  g.fillStyle = '#a8402e'; g.fillRect(0,0,w,h);
  const rows = 4, cw = 32;
  for(let r=0; r<rows; r++){
    const y = h - r*64, off = (r%2)*cw/2;
    for(let x=-cw; x<w+cw; x+=cw){
      const v = 0.85 + Math.random()*0.3;
      g.fillStyle = `rgb(${168*v|0},${64*v|0},${46*v|0})`;
      g.beginPath(); g.moveTo(x, y-64); g.lineTo(x+cw, y-64);
      g.arc(x+cw-cw/2, y-64, cw/2, 0, Math.PI); g.closePath(); g.fill();
      g.strokeStyle = 'rgba(80,25,15,0.45)'; g.lineWidth = 2; g.stroke();
    }
  }
});
// river stone — foundation
const stoneTex = canvasTex(256, 256, (g,w,h)=>{
  g.fillStyle = '#8d887d'; g.fillRect(0,0,w,h);
  for(let i=0;i<90;i++){
    const x = Math.random()*w, y = Math.random()*h, rw = 18+Math.random()*26, rh = 12+Math.random()*16;
    const v = 0.8 + Math.random()*0.35;
    g.fillStyle = `rgb(${150*v|0},${145*v|0},${136*v|0})`;
    g.beginPath(); g.ellipse(x, y, rw, rh, Math.random(), 0, Math.PI*2); g.fill();
    g.strokeStyle = 'rgba(60,55,48,0.5)'; g.lineWidth = 3; g.stroke();
  }
}, 2.2, 0.6);
// oak door with recessed panels
const doorTex = canvasTex(256, 512, (g,w,h)=>{
  g.fillStyle = '#7a4a26'; g.fillRect(0,0,w,h);
  for(let i=0;i<1400;i++){ g.fillStyle = `rgba(60,35,15,${Math.random()*0.08})`;
    g.fillRect(0, Math.random()*h, w, 1); }                       // grain
  const panel = (x,y,pw,ph)=>{
    g.strokeStyle = 'rgba(45,25,10,0.8)'; g.lineWidth = 6; g.strokeRect(x,y,pw,ph);
    g.strokeStyle = 'rgba(255,225,180,0.25)'; g.lineWidth = 2; g.strokeRect(x+5,y+5,pw-10,ph-10);
  };
  panel(38, 40, 180, 190); panel(38, 280, 180, 190);
}, 1, 1);
// painted grass — base + blobs + speckle + tiny flowers
const grassTex = canvasTex(512, 512, (g,w,h)=>{
  g.fillStyle = '#79b356'; g.fillRect(0,0,w,h);
  for(let i=0;i<260;i++){ const r = 20+Math.random()*46;
    g.fillStyle = `rgba(${60+Math.random()*50|0},${140+Math.random()*50|0},${50+Math.random()*40|0},0.25)`;
    g.beginPath(); g.ellipse(Math.random()*w, Math.random()*h, r, r*0.7, Math.random()*3, 0, Math.PI*2); g.fill(); }
  for(let i=0;i<3500;i++){ g.fillStyle = Math.random()<.5 ? 'rgba(40,90,30,0.3)' : 'rgba(200,235,150,0.3)';
    g.fillRect(Math.random()*w, Math.random()*h, 2, 3); }
  for(let i=0;i<70;i++){ g.fillStyle = Math.random()<.5 ? '#f5f0d8' : '#f2d060';
    g.beginPath(); g.arc(Math.random()*w, Math.random()*h, 2.2, 0, Math.PI*2); g.fill(); }
}, 3, 3);

const M = (o={}) => new THREE.MeshStandardMaterial({ roughness:0.85, metalness:0.02, ...o });

/* ══════════ ground ══════════ */
const ground = new THREE.Mesh(
  new THREE.CylinderGeometry(9, 9, 0.4, 56),
  [ M({color:0x6d5a3e}), M({map:grassTex, roughness:1}), M({color:0x6d5a3e}) ]);  // [side, top, bottom]
ground.position.y = -0.2; ground.receiveShadow = true; scene.add(ground);

/* ══════════ house ══════════ */
const house = new THREE.Group(); scene.add(house);
const add = (geo, mat, x,y,z, parent=house) => {
  const p = new THREE.Mesh(geo, mat); p.position.set(x,y,z);
  p.castShadow = p.receiveShadow = true; parent.add(p); return p;
};

// foundation (river stone) — top at y=0.5
add(new THREE.BoxGeometry(5.5, 0.5, 4.5), M({map:stoneTex}), 0, 0.25, 0);

// walls (clapboard; plain top/bottom via material array — box order [+x,-x,+y,-y,+z,-z])
const wallMat = M({map:sidingTex});
const plain = M({color:0xe8d9b8});
add(new THREE.BoxGeometry(5, 2.6, 4), [wallMat, wallMat, plain, plain, wallMat, wallMat], 0, 1.8, 0);

// gabled roof — triangular prism, ridge along z, 0.5 eave overhang
const tri = new THREE.Shape(); tri.moveTo(-3, 0); tri.lineTo(3, 0); tri.lineTo(0, 1.5); tri.closePath();
const roofGeo = new THREE.ExtrudeGeometry(tri, { depth: 5, bevelEnabled: false });
roofGeo.translate(0, 0, -2.5);
add(roofGeo, M({map:shingleTex, roughness:0.9}), 0, 3.1, 0);
add(new THREE.BoxGeometry(0.34, 0.12, 5.1), M({color:0x7c2d20}), 0, 4.62, 0);   // ridge cap

// chimney (intersects roof) + cap + flue
add(new THREE.BoxGeometry(0.62, 2.1, 0.62), M({color:0x9a6a52, roughness:0.95}), -1.6, 3.9, -0.8);
add(new THREE.BoxGeometry(0.82, 0.14, 0.82), M({color:0x777066}), -1.6, 4.98, -0.8);
add(new THREE.CylinderGeometry(0.16, 0.16, 0.2, 12), M({color:0x333333}), -1.6, 5.1, -0.8);

// covered porch: deck, step, posts, sloped roof
add(new THREE.BoxGeometry(3.2, 0.2, 1.4), M({color:0x8a6a44, roughness:0.9}), 0, 0.4, 2.55);
add(new THREE.BoxGeometry(1.3, 0.24, 0.55), M({color:0x8a6a44}), 0, 0.12, 3.45);
const postGeo = new THREE.CylinderGeometry(0.075, 0.085, 2.3, 10);
add(postGeo, M({color:0xf2ead9}), -1.42, 1.62, 3.15);
add(postGeo, M({color:0xf2ead9}),  1.42, 1.62, 3.15);
const porchRoof = add(new THREE.BoxGeometry(3.5, 0.12, 1.85), M({map:shingleTex}), 0, 2.86, 2.75);
porchRoof.rotation.x = 0.30;

// door + knob + step lamp
add(new THREE.BoxGeometry(0.95, 1.75, 0.1), M({map:doorTex, roughness:0.6}), 0, 1.375, 2.06);
add(new THREE.SphereGeometry(0.05, 12, 12), M({color:0xd8b04a, metalness:0.7, roughness:0.3}), 0.32, 1.32, 2.13);
const lamp = add(new THREE.SphereGeometry(0.09, 12, 12),
  M({color:0xffe9b0, emissive:0xffc35a, emissiveIntensity:2}), 0.62, 2.28, 2.12);

// windows: warm glass (shared, flickers) + frames
const winMat = M({ color:0xffdf9e, emissive:0xffa53a, emissiveIntensity:1.1, roughness:0.25 });
const frameMat = M({color:0xf2ead9});
const shutterMat = M({color:0x5d7a52});
function windowUnit(parent, x, y, z, rotY=0){
  const g = new THREE.Group(); g.position.set(x,y,z); g.rotation.y = rotY; parent.add(g);
  const w = add(new THREE.BoxGeometry(0.78, 0.88, 0.06), winMat, 0, 0, 0, g);
  add(new THREE.BoxGeometry(0.94, 1.04, 0.05), frameMat, 0, 0, -0.035, g);
  add(new THREE.BoxGeometry(0.9, 0.07, 0.08), frameMat, 0, 0, 0.01, g);   // cross muntins
  add(new THREE.BoxGeometry(0.07, 0.88, 0.08), frameMat, 0, 0, 0.01, g);
  return g;
}
const wfL = windowUnit(house, -1.6, 1.85, 2.06);
const wfR = windowUnit(house,  1.6, 1.85, 2.06);
for(const [wu, side] of [[wfL,-1],[wfR,1]]){                 // shutters, front windows only
  add(new THREE.BoxGeometry(0.3, 0.98, 0.06), shutterMat, side*0.66, 0, -0.01, wu);
}
windowUnit(house, -2.56, 1.85, 0.3, -Math.PI/2);             // side windows
windowUnit(house,  2.56, 1.85, -0.5,  Math.PI/2);

// round gable window + frame
const gableWin = new THREE.Group(); gableWin.position.set(0, 3.85, 2.51); house.add(gableWin);
add(new THREE.CylinderGeometry(0.27, 0.27, 0.1, 24), winMat, 0, 0, 0, gableWin).rotation.x = Math.PI/2;
add(new THREE.TorusGeometry(0.3, 0.05, 10, 24), frameMat, 0, 0, 0, gableWin);
add(new THREE.BoxGeometry(0.54, 0.05, 0.06), frameMat, 0, 0, 0.02, gableWin);
add(new THREE.BoxGeometry(0.05, 0.54, 0.06), frameMat, 0, 0, 0.02, gableWin);

// window flower boxes + instanced flowers
const flowerMat = new THREE.MeshStandardMaterial({roughness:0.6});
const flowers = new THREE.InstancedMesh(new THREE.SphereGeometry(0.055, 8, 8), flowerMat, 24);
{ const dummy = new THREE.Object3D(), palette = [0xf2668b, 0xf2a03d, 0xe85d75, 0xfff1b8, 0xd970d9];
  let i = 0;
  for(const bx of [-1.6, 1.6]){
    add(new THREE.BoxGeometry(1.0, 0.17, 0.3), M({color:0x7a5a38}), bx, 1.26, 2.14);
    add(new THREE.BoxGeometry(0.92, 0.1, 0.22), M({color:0x3f6b2f}), bx, 1.33, 2.14);  // greens base
    for(let k=0;k<12;k++){
      dummy.position.set(bx - 0.38 + (k%6)*0.152, 1.42 + (k>5?0.06:0), 2.14 + (k>5?0.05:-0.04));
      dummy.updateMatrix(); flowers.setMatrixAt(i, dummy.matrix);
      flowers.setColorAt(i, new THREE.Color(palette[i % palette.length])); i++;
    }
  }
}
flowers.castShadow = true; house.add(flowers);

// bushes
const bushMat = M({color:0x41722f});
for(const [bx, bz, s] of [[-2.6, 1.7, 1.0], [2.55, 1.8, 0.85], [2.7, 0.4, 0.6]]){
  const b = add(new THREE.SphereGeometry(0.48, 10, 8), bushMat, bx, 0.32, bz);
  b.scale.set(s, s*0.72, s);
}

/* ══════════ yard dressing: tree, path, fence ══════════ */
const treeCrown = new THREE.Group(); treeCrown.position.set(4.6, 1.55, 1.2); scene.add(treeCrown);
add(new THREE.CylinderGeometry(0.13, 0.2, 1.6, 10), M({color:0x6b4423, roughness:0.95}),
   4.6, 0.8, 1.2, scene);
const leafMat = M({color:0x5c9e3f, roughness:0.9});
for(const [x,y,z,r,c] of [[0,0.25,0,1.05,0x5c9e3f],[0.62,0.72,0.25,0.75,0x6cab48],[-0.55,0.62,-0.2,0.7,0x528f38]]){
  add(new THREE.SphereGeometry(r, 14, 12), M({color:c}), x, y, z, treeCrown);
}

const stones = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.34, 0.34, 0.09, 8),
  M({color:0x9d9789, roughness:1}), 6);
{ const dummy = new THREE.Object3D();
  for(let i=0;i<6;i++){
    dummy.position.set((i%2 ? -1:1) * (0.1 + Math.random()*0.15), 0.045, 3.95 + i*0.42);
    dummy.rotation.y = Math.random()*3; dummy.scale.set(1, 1, 0.72);
    dummy.updateMatrix(); stones.setMatrixAt(i, dummy.matrix);
  }
}
stones.receiveShadow = true; scene.add(stones);

const picketMat = M({color:0xf2ead9});
for(const side of [-1, 1]){
  add(new THREE.BoxGeometry(1.7, 0.07, 0.05), picketMat, side*1.35, 0.55, 4.9, scene);
  add(new THREE.BoxGeometry(1.7, 0.07, 0.05), picketMat, side*1.35, 0.3, 4.9, scene);
  for(let k=0;k<4;k++){
    const p = add(new THREE.BoxGeometry(0.15, 0.75, 0.05), picketMat, side*(0.75 + k*0.42), 0.42, 4.9, scene);
    p.rotation.y = side * 0.02 * k;
  }
}

/* ══════════ chimney smoke (§4 noise-twist shader) ══════════ */
function makeNoiseTexture(){
  const s=document.createElement('canvas'); s.width=s.height=16;
  const sg=s.getContext('2d'), id=sg.createImageData(16,16);
  for(let i=0;i<16*16;i++){ const v=Math.random()*255; id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v; id.data[i*4+3]=255; }
  sg.putImageData(id,0,0);
  const c=document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d'); g.imageSmoothingEnabled=true;
  g.drawImage(s,0,0,16,16,0,0,64,64);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}
const smokeMat = new THREE.ShaderMaterial({
  uniforms:{ uTime:{value:0}, uNoise:{value:makeNoiseTexture()} },
  vertexShader:`uniform float uTime; uniform sampler2D uNoise; varying vec2 vUv;
    void main(){
      vUv=uv;
      float n=texture2D(uNoise, vec2(0.5, uv.y*2.5 - uTime*0.35)).r;
      vec2 wind=(vec2(texture2D(uNoise,vec2(0.25,uTime*0.25)).r, texture2D(uNoise,vec2(0.75,uTime*0.25)).r)-0.5)*pow(uv.y,2.0)*0.5;
      vec3 p=position;
      float a=n*1.5708, ca=cos(a*uv.y), sa=sin(a*uv.y);
      p.xz=mat2(ca,-sa,sa,ca)*p.xz; p.xz+=wind;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
    }`,
  fragmentShader:`uniform float uTime; uniform sampler2D uNoise; varying vec2 vUv;
    void main(){
      float n=texture2D(uNoise, vec2(0.5, vUv.y*2.0 - uTime*0.15)).r;
      float a=smoothstep(0.15,0.7,n)*smoothstep(1.0,0.2,vUv.y)*smoothstep(0.0,0.15,vUv.y);
      vec3 col=mix(vec3(0.62),vec3(0.92),vUv.y);
      gl_FragColor=vec4(col,a*0.38);
    }`,
  transparent:true, depthWrite:false, side:THREE.DoubleSide
});
const smoke = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 2.4, 8, 12), smokeMat);
smoke.position.set(-1.6, 6.4, -0.8); scene.add(smoke);

/* ══════════ butterfly ══════════ */
const butterfly = new THREE.Group(); scene.add(butterfly);
add(new THREE.SphereGeometry(0.05, 8, 8), M({color:0x3a3230}), 0, 0, 0, butterfly).scale.set(0.7, 0.7, 2.6);
const wingGeo = new THREE.PlaneGeometry(0.2, 0.3); wingGeo.translate(0, 0.15, 0);
const wingMatB = M({color:0xf2a03d, side:THREE.DoubleSide, emissive:0xf2a03d, emissiveIntensity:0.15});
const wingL = new THREE.Group(); wingL.position.z = 0.03; butterfly.add(wingL);
const wingR = new THREE.Group(); wingR.position.z = -0.03; butterfly.add(wingR);
const wl = new THREE.Mesh(wingGeo, wingMatB); wl.rotation.x = -Math.PI/2; wingL.add(wl);
const wr = new THREE.Mesh(wingGeo, wingMatB); wr.rotation.x = -Math.PI/2; wr.rotation.y = Math.PI; wingR.add(wr);

/* ══════════ animate ══════════ */
function animate(t){
  smokeMat.uniforms.uTime.value = t*0.001;
  winMat.emissiveIntensity = 1.0 + 0.25*Math.sin(t*0.0021) + 0.08*Math.sin(t*0.013);   // candle flicker
  lamp.material.emissiveIntensity = 1.6 + 0.5*Math.sin(t*0.003);
  treeCrown.rotation.z = Math.sin(t*0.0008)*0.035;
  treeCrown.rotation.x = Math.cos(t*0.0006)*0.02;
  const bx = Math.sin(t*0.00045)*3.4, bz = 2.8 + Math.cos(t*0.0006)*1.8, by = 1.5 + Math.sin(t*0.0013)*0.5;
  butterfly.position.set(bx, by, bz);
  butterfly.rotation.y = Math.cos(t*0.00045) > 0 ? 0.3 : Math.PI-0.3;
  const flap = Math.sin(t*0.025)*0.9;
  wingL.rotation.x = flap; wingR.rotation.x = -flap;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
